<meta http-equiv="content-type" content="text/html; charset=UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1"
/>

<!-- JQuery -->
<script src="/jquery-3.7.1.min.js"></script>

<!-- Bootstrap minified CSS and JS-->
<link
  rel="stylesheet"
  href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
  integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
  crossorigin="anonymous"
/>

<script
  src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"
  integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
  crossorigin="anonymous"
></script>

<!-- Font Awesome -->
<link
  href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
  rel="stylesheet"
  integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN"
  crossorigin="anonymous"
/>

<!-- Custom CSS -->
<link rel="stylesheet" href="{{ "css/nix.css" | absURL }}" />
<link rel="stylesheet" href="{{ "css/svg-diagrams.css" | absURL }}" />

<!-- Google Fonts -->
<link
  href="https://fonts.googleapis.com/css?family=Inconsolata%7COpen+Sans%7CConcert+One"
  rel="stylesheet"
/>

<!-- Self-hosted analytics (Rybbit) through the same-origin Ingest path, on the
     production build only. The meta tag tells the edge injection plugin that
     the page loads the script itself (infra ADR-0041). -->
<meta name="analytics" content="sdk" />
{{ if hugo.IsProduction }}
<script
  src="/_t/r/script.js"
  data-site-id="1"
  defer
  data-replay-mask-all-inputs="false"
  data-replay-mask-input-options='{"password":true}'
></script>
{{ end }}
